<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Judo Training System</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

</head>
<body>

<h1>🥋 Judo Training System</h1>

<!-- MODE SELECT -->
<div class="controls">
    <button onclick="setMode('study')">Study</button>
    <button onclick="setMode('quiz')">Quiz</button>
    <button onclick="toggleInstructor()">Instructor Mode</button>
    <button onclick="exportData()">Export Curriculum</button>
</div>

<!-- BELT FILTER -->
<div class="controls">
    <select onchange="setBelt(this.value)">
        <option value="all">All Belts</option>
        <option value="rokkyu">Rokkyu</option>
        <option value="gokyu">Gokyu</option>
        <option value="yonkyu">Yonkyu</option>
        <option value="sankyu">Sankyu</option>
        <option value="nikyu">Nikyu</option>
        <option value="ikkyu">Ikkyu</option>
        <option value="unknown">Needs Review</option>
    </select>
</div>

<!-- CARD -->
<div class="card" id="card">
    <div class="card-inner" id="cardInner">
        <div class="card-front" id="frontText"></div>
        <div class="card-back" id="backText"></div>
    </div>
</div>

<!-- QUIZ -->
<div id="quizButtons" class="controls" style="display:none;">
    <button onclick="answer(true)">Correct</button>
    <button onclick="answer(false)">Wrong</button>
</div>

<div class="controls">
    <button onclick="prevCard()">Prev</button>
    <button onclick="flipCard()">Flip</button>
    <button onclick="nextCard()">Next</button>
</div>

<!-- NEW MODES -->
<div class="controls">
    <button onclick="startGrading()">Grading Mode</button>
    <button onclick="startCleanup()">Cleanup Mode</button>
</div>

<!-- CLEANUP ASSIGN -->
<div id="cleanupControls" class="controls" style="display:none;">
    <select id="beltAssign">
        <option value="rokkyu">Rokkyu</option>
        <option value="gokyu">Gokyu</option>
        <option value="yonkyu">Yonkyu</option>
        <option value="sankyu">Sankyu</option>
        <option value="nikyu">Nikyu</option>
        <option value="ikkyu">Ikkyu</option>
    </select>

    <button onclick="assignBelt()">Assign</button>
</div>

<p id="counter"></p>
<p id="score"></p>
<p id="timer"></p>

<script src="script.js"></script>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
